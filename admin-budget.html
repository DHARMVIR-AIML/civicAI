<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Department Budget | CivicAI</title>

    <link
        rel="stylesheet"
        href="css/admin-dashboard.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .budget-page {
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .page-header {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .page-header h1 {
            margin: 0 0 8px;
        }

        .page-header p {
            margin: 0;
            color: #666;
        }

        .budget-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .summary-card span {
            display: block;
            color: #666;
            margin-bottom: 10px;
        }

        .summary-card strong {
            font-size: 26px;
        }

        .allocations-section {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .allocations-section h2 {
            margin-top: 0;
        }

        .allocation-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .allocation-card {
            border: 1px solid #e3e7ef;
            border-radius: 12px;
            padding: 20px;
            background: #fafbff;
        }

        .allocation-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        .allocation-amount {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .allocation-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .info-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .info-box small {
            display: block;
            color: #777;
            margin-bottom: 5px;
        }

        .info-box strong {
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            background: #eee;
            color: #333;
        }

        @media (max-width: 768px) {

            .budget-page {
                padding: 15px;
            }

            .budget-summary {
                grid-template-columns: 1fr;
            }

            .allocation-container {
                grid-template-columns: 1fr;
            }

            .allocation-info {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <main class="budget-page">


        <a
            href="admin-dashboard.html"
            class="back-btn"
        >
            ← Back to Dashboard
        </a>


        <div class="page-header">

            <h1>
                Department Budget Allocation
            </h1>

            <p id="adminDepartmentText">
                Loading your department information...
            </p>

        </div>


        <!-- SUMMARY -->

        <div class="budget-summary">


            <div class="summary-card">

                <span>
                    Total Distributed Budget
                </span>

                <strong id="totalBudget">
                    ₹0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Your Departments
                </span>

                <strong id="departmentCount">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Your Allocated Budget
                </span>

                <strong id="myAllocatedBudget">
                    ₹0
                </strong>

            </div>


        </div>


        <!-- ALLOCATIONS -->

        <div class="allocations-section">

            <h2>
                Your Department Allocations
            </h2>


            <div
                id="loading"
                class="loading"
            >
                Loading budget...
            </div>


            <div
                id="allocationContainer"
                class="allocation-container"
            ></div>


            <div
                id="emptyState"
                class="empty-state"
                style="display:none;"
            >

                No budget allocation is available
                for your assigned departments.

            </div>

        </div>


    </main>


    <script src="js/admin-budget.js"></script>

</body>

</html>
